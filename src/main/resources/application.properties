spring.profiles.active=dev
spring.config.use-legacy-processing=true
#-----------------------------------------------------------------------
#
#   globals.properties : \uc2dc\uc2a4\ud15c 
#   
#-----------------------------------------------------------------------
#   1.  key = value \uad6c\uc870\uc785\ub2c8\ub2e4.
#   2.  key\uac12\uc740 \uacf5\ubc31\ubb38\uc790\ub97c \ud3ec\ud568\ubd88\uac00, value\uac12\uc740 \uacf5\ubc31\ubb38\uc790\ub97c \uac00\ub2a5
#   3.  key\uac12\uc73c\ub85c \ud55c\uae00\uc744 \uc0ac\uc6a9\ubd88\uac00,   value\uac12\uc740 \ud55c\uae00\uc0ac\uc6a9\uc774 \uac00\ub2a5
#   4.  \uc904\uc744 \ubc14\uafc0 \ud544\uc694\uac00 \uc788\uc73c\uba74 '\'\ub97c \ub77c\uc778\uc758 \ub05d\uc5d0 \ucd94\uac00(\ub9cc\uc57d  '\'\ubb38\uc790\ub97c \uc0ac\uc6a9\ud574\uc57c \ud558\ub294 \uacbd\uc6b0\ub294 '\\'\ub97c \uc0ac\uc6a9)
#   5.  Windows\uc5d0\uc11c\uc758 \ub514\ub809\ud1a0\ub9ac \ud45c\uc2dc : '\\' or '/'  ('\' \uc0ac\uc6a9\ud558\uba74 \uc548\ub428)
#   6.  Unix\uc5d0\uc11c\uc758 \ub514\ub809\ud1a0\ub9ac \ud45c\uc2dc : '/'
#   7.  \uc8fc\uc11d\ubb38 \ucc98\ub9ac\ub294  #\uc0ac\uc6a9
#   8.  value\uac12 \ub4a4\uc5d0 \uc2a4\ud398\uc774\uc2a4\uac00 \uc874\uc7ac\ud558\ub294 \uacbd\uc6b0 \uc11c\ube14\ub9bf\uc5d0\uc11c \ucc38\uc870\ud560\ub54c\ub294 \uc5d0\ub7ec\ubc1c\uc0dd\ud560 \uc218 \uc788\uc73c\ubbc0\ub85c trim()\ud558\uac70\ub098 \ub9c8\uc9c0\ub9c9 \uacf5\ubc31\uc5c6\uc774 properties \uac12\uc744 \uc124\uc815\ud560\uac83
#-----------------------------------------------------------------------

# G4C \uc5f0\uacb0\uc6a9 IP (localhost)
Globals.LocalIp=127.0.0.1

# DB\uc11c\ubc84 \ud0c0\uc785(hsql,mysql,oracle,altibase,tibero) - datasource \ubc0f sqlMap \ud30c\uc77c \uc9c0\uc815\uc5d0 \uc0ac\uc6a9\ub428
# MySQL 사용 시: Globals.DbType=mysql (MySQL 서버 및 DB 'sht' 생성 후 변경)
# MySQL 비밀번호: Globals.mysql.Password= 에 설정 필요
Globals.DbType=hsql

# DB \uc811\uadfc \uc815\ubcf4

# Page Config
Globals.pageUnit=10
Globals.pageSize=10

# File Config
Globals.posblAtchFileSize=5242880
Globals.fileStorePath=./files
Globals.addedOptions=false

#hsql - local hssql \uc0ac\uc6a9\uc2dc\uc5d0 \uc801\uc6a9 (\ub0b4\uc7a5 hsql\uc740 \uc815\ubcf4 \ud544\uc694 \uc5c6\uc74c)
Globals.hsql.DriverClassName=net.sf.log4jdbc.DriverSpy
Globals.hsql.Url=jdbc:log4jdbc:hsqldb:hsql://127.0.0.1/sampledb
Globals.hsql.UserName=sa
Globals.hsql.Password=

# mysql
Globals.mysql.DriverClassName=net.sf.log4jdbc.DriverSpy
Globals.mysql.Url=jdbc:log4jdbc:mysql://127.0.0.1:3306/sht
Globals.mysql.UserName=root
Globals.mysql.Password=

#postgresql (Globals.DbType=postgresql 로 전환 시 사용. DB 'sht' 생성 후 계정/비밀번호 설정)
Globals.postgresql.DriverClassName=org.postgresql.Driver
Globals.postgresql.Url=jdbc:postgresql://127.0.0.1:5432/sht
Globals.postgresql.UserName=postgres
Globals.postgresql.Password=

#oracle
Globals.oracle.DriverClassName=oracle.jdbc.driver.OracleDriver
Globals.oracle.Url=jdbc:oracle:thin:@127.0.0.1:1521:egovfrm
Globals.oracle.UserName=
Globals.oracle.Password=


#altibase
Globals.altibase.DriverClassName=Altibase.jdbc.driver.AltibaseDriver
Globals.altibase.Url=jdbc:Altibase://127.0.0.1:1721/egovfrm?encoding=UTF-8
Globals.altibase.UserName=
Globals.altibase.Password=

#tibero
Globals.tibero.DriverClassName=com.tmax.tibero.jdbc.TbDriver
Globals.tibero.Url=jdbc:tibero:thin:@127.0.0.1:1821:egovfrm
Globals.tibero.UserName=
Globals.tibero.Password=

#cubrid
Globals.cubrid.DriverClassName=cubrid.jdbc.driver.CUBRIDDriver
Globals.cubrid.Url=jdbc:cubrid:127.0.0.1:33000:sht:::?charset=utf-8
Globals.cubrid.UserName=
Globals.cubrid.Password=


# \ud30c\uc77c \ud655\uc7a5\uc790 \ud654\uc774\ud2b8\ub9ac\uc2a4\ud2b8(\ud5c8\uc6a9\ubaa9\ub85d) : \ud30c\uc77c \ud655\uc7a5\uc790\ub97c (.)\uacfc \ud568\uaed8 \uc5f0\uc774\uc5b4\uc11c \uc0ac\uc6a9\ud558\uba70 (.)\ub85c \uc2dc\uc791\ud55c\ub2e4.
Globals.fileUpload.Extensions.Images = .gif.jpg.jpeg.png
Globals.fileUpload.Extensions = .gif.jpg.jpeg.png.xls.xlsx.pdf.doc.docx.ppt.pptx.hwp.hwpx.txt.zip

# Access-Control-Allow-Origin
# SPA 프론트 개발 서버: egov-simple-react(3000) / egov-simple-vue(3001)
# 운영 배포 시 실제 프론트 도메인으로 교체 (와일드카드 금지 — credentials 쿠키 인증 사용)
Globals.Allow.Origin = ${EGOV_ALLOW_ORIGIN:http://localhost:3000,http://localhost:3001}


# 파일 업로드 크기 제한 (파일당 10MB, 요청 전체 35MB — 최대 3개 첨부 대응)
# 미설정 시 Spring Boot 기본값(파일당 1MB)이 적용되어 1MB 초과 첨부가 거부된다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# 요청/응답 전 구간 UTF-8 강제 (한글 폼 저장 깨짐 방지)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 서버 렌더링 미사용 — 이 백엔드는 REST API 전용이다.
# 정적 리소스 매핑도 끈다(화면 자산은 egov-simple-react / egov-simple-vue 가 제공).
spring.web.resources.add-mappings=false
# 매핑되지 않은 요청은 404 예외로 던져 JSON 에러 응답(GlobalApiExceptionHandler)으로 처리한다.
spring.mvc.throw-exception-if-no-handler-found=true

#\uc554\ud638\ud654\uc11c\ube44\uc2a4 \uc54c\uace0\ub9ac\uc998 \ud0a4 \u2014 \uc6b4\uc601 \ubc30\ud3ec \uc2dc \ud658\uacbd\ubcc0\uc218 EGOV_CRYPTO_KEY \ub85c \ubc18\ub4dc\uc2dc \uad50\uccb4 (16\uc790 \uc774\uc0c1 \ubb34\uc791\uc704 \uac12). localhost \uac1c\ubc1c\uc6a9 \ub514\ud3f4\ud2b8 placeholder \uc81c\uacf5.
Globals.crypto.algoritm = ${EGOV_CRYPTO_KEY:egovframe}

#JWT secret key \u2014 \uc6b4\uc601 \ubc30\ud3ec \uc2dc \ud658\uacbd\ubcc0\uc218 EGOV_JWT_SECRET \ub85c \ubc18\ub4dc\uc2dc \uad50\uccb4 (32\uc790 \uc774\uc0c1 \ubb34\uc791\uc704 \uac12). localhost \uac1c\ubc1c\uc6a9 \ub514\ud3f4\ud2b8 placeholder \uc81c\uacf5.
Globals.jwt.secret = ${EGOV_JWT_SECRET:my-secret-jwt-key-for-egovframe-simple-spa-project}
#\uc6b4\uc601 \ubc30\ud3ec \uc2dc \ud574\ub2f9 \uac12\uc740 true\ub85c \uc124\uc815 \ud544\uc694
Globals.jwt.cookieSecure = ${JWT_COOKIE_SECURE:false}
# ACCESS_TOKEN \ucfe0\ud0a4\uc758 SameSite \uc18d\uc131
# - \ud504\ub860\ud2b8\uc640 API \uac00 \uac19\uc740 \uc0ac\uc774\ud2b8(localhost:3000 \u2192 localhost:8090, \ub610\ub294 \uac19\uc740 \ub4f1\ub85d\ub3c4\uba54\uc778): Lax
# - \ud504\ub860\ud2b8\uc640 API \uc758 \ub4f1\ub85d\ub3c4\uba54\uc778\uc774 \ub2e4\ub984(\uc608: app.example.com \u2192 api.other.com): None (+ cookieSecure=true, HTTPS \ud544\uc218)
Globals.jwt.cookieSameSite = ${JWT_COOKIE_SAMESITE:Lax}

# SPA 프론트와 경로가 겹치지 않도록 모든 REST 엔드포인트를 /api 아래로 노출한다.
# 예) 게시물 목록 = GET http://localhost:8090/api/board
server.servlet.context-path=/api
server.port = 8090
server.servlet.session.timeout=3600
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

#Logging 
#file path\uc758 default \uac12\uc740 \ud504\ub85c\uc81d\ud2b8 root \uacbd\ub85c\uc774\ubbc0\ub85c \uc6d0\ud558\uc2dc\ub294 \uacbd\ub85c\ub85c \ubcc0\uacbd\ud558\uc5ec \uc0ac\uc6a9\ud558\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.
logging.root.level=INFO
logging.file.name=egov-simple-api
logging.file.path=./log
logging.rollingpolicy.maxFileSize=10MB
logging.rollingpolicy.maxHistory=30

#swaggerdoc
springdoc.version=v4.2.0
springdoc.packages-to-scan=egovframework
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.groups.enabled=true
springdoc.cache.disabled=true

#Sns — 콜백은 SPA 프론트 라우트로 돌아온다(egov-simple-react 기준 3000)
Sns.naver.clientId=YOUR_CLIENT_ID
Sns.naver.clientSecret=YOUR_CLIENT_SECRET
Sns.naver.callbackUrl=http://localhost:3000/login/naver/callback
Sns.kakao.clientId=YOUR_CLIENT_ID
Sns.kakao.callbackUrl=http://localhost:3000/login/kakao/callback

# SPA 프론트 기준 URL — 로그인 리다이렉트·메일 링크 등 서버가 프론트로 돌려보낼 때 사용
Globals.frontUrl = ${EGOV_FRONT_URL:http://localhost:3000}